
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roast My Day 🔥</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07050f;
      --surface: #0e0b1a;
      --surface2: #150f24;
      --purple: #a855f7;
      --purple2: #7c3aed;
      --purple3: #c084fc;
      --muted: #6b5f8a;
      --border: #2a1f45;
      --white: #f0ebff;
      --green: #86efac;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--white); font-family: 'Syne', sans-serif; min-height: 100vh; overflow-x: hidden; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(124,58,237,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 10% 50%, rgba(168,85,247,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 90% 80%, rgba(192,132,252,0.07) 0%, transparent 60%);
      pointer-events: none;
      animation: breathe 5s ease-in-out infinite alternate;
    }
    @keyframes breathe { from { opacity: 0.6; } to { opacity: 1; } }
    .container { max-width: 680px; margin: 0 auto; padding: 52px 24px 80px; position: relative; z-index: 1; }
    header { text-align: center; margin-bottom: 52px; animation: slideDown 0.8s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes slideDown { from { opacity:0; transform:translateY(-30px); } to { opacity:1; transform:translateY(0); } }
    .flame-icon { font-size: 64px; display: block; animation: flicker 2s ease-in-out infinite alternate; filter: drop-shadow(0 0 24px rgba(168,85,247,0.9)); }
    @keyframes flicker {
      0%   { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 20px rgba(168,85,247,0.8)); }
      33%  { transform: scale(1.05) rotate(1deg); filter: drop-shadow(0 0 35px rgba(124,58,237,1)); }
      66%  { transform: scale(0.97) rotate(-1deg); filter: drop-shadow(0 0 15px rgba(192,132,252,0.7)); }
      100% { transform: scale(1.02) rotate(2deg); filter: drop-shadow(0 0 28px rgba(168,85,247,0.9)); }
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(56px,13vw,96px);
      letter-spacing: 5px;
      line-height: 0.92;
      margin-top: 14px;
      background: linear-gradient(135deg, #c084fc 0%, #a855f7 50%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(168,85,247,0.35));
    }
    .subtitle { margin-top: 14px; font-size: 13px; color: var(--muted); letter-spacing: 4px; text-transform: uppercase; font-weight: 600; }
    .day-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 6px 16px; border: 1px solid var(--border); border-radius: 100px; font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; background: rgba(168,85,247,0.05); }
    .divider { display: flex; align-items: center; gap: 16px; margin: 0 auto 44px; width: 80%; }
    .divider::before { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border)); }
    .divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
    .divider-icon { color: var(--purple); font-size: 14px; }
    .input-section { animation: slideUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s both; }
    @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    .input-label { display: block; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--purple); font-weight: 700; margin-bottom: 12px; font-family: 'JetBrains Mono', monospace; }
    .day-textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; color: var(--white); font-family: 'Syne', sans-serif; font-size: 16px; line-height: 1.7; resize: none; min-height: 200px; outline: none; transition: border-color 0.3s, box-shadow 0.3s, background 0.3s; caret-color: var(--purple); }
    .day-textarea::placeholder { color: var(--border); font-style: italic; }
    .day-textarea:focus { border-color: var(--purple2); box-shadow: 0 0 0 3px rgba(124,58,237,0.1); background: var(--surface2); }
    .char-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .char-count { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--border); transition: color 0.3s; }
    .char-count.active { color: var(--muted); }
    .char-count.ready { color: var(--purple); }
    .char-hint { font-size: 11px; color: var(--border); letter-spacing: 1px; }
    .roast-btn { margin-top: 28px; width: 100%; padding: 20px; background: linear-gradient(135deg, var(--purple2), var(--purple)); border: none; border-radius: 14px; color: #fff; font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 5px; cursor: pointer; transition: transform 0.2s, box-shadow 0.3s; box-shadow: 0 4px 32px rgba(124,58,237,0.45); }
    .roast-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 44px rgba(124,58,237,0.6); }
    .roast-btn:active:not(:disabled) { transform: translateY(0); }
    .roast-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-content { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-section { margin-top: 48px; animation: revealRoast 0.6s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes revealRoast { from { opacity:0; transform:scale(0.95) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
    .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 36px 32px; position: relative; overflow: hidden; }
    .result-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--purple2), var(--purple3), var(--purple)); }
    .result-label { display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--purple); margin-bottom: 20px; }
    .result-label-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
    .roast-text { font-size: 17px; line-height: 1.85; color: var(--white); }
    .roast-text .wholesome { display: block; margin-top: 20px; color: var(--green); font-style: italic; font-size: 15px; padding-top: 16px; border-top: 1px solid var(--border); }
    .share-row { display: flex; gap: 12px; margin-top: 24px; }
    .share-btn, .retry-btn { flex: 1; padding: 13px; border-radius: 10px; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; }
    .share-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
    .share-btn:hover { background: var(--border); color: var(--white); }
    .retry-btn { background: transparent; border: 1px solid var(--purple2); color: var(--purple3); }
    .retry-btn:hover { background: rgba(124,58,237,0.12); }
    .error-card { margin-top: 20px; padding: 16px 20px; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 12px; color: #f87171; font-size: 14px; font-family: 'JetBrains Mono', monospace; display: flex; gap: 10px; }
    footer { text-align: center; margin-top: 64px; font-size: 12px; color: var(--border); letter-spacing: 1px; }
    footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--purple); }
    @media (max-width: 480px) { .container { padding: 32px 16px 60px; } .result-card { padding: 24px 20px; } .share-row { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="flame-icon">🔥</span>
      <h1>ROAST<br>MY DAY</h1>
      <p class="subtitle">AI-Powered Brutal Honesty</p>
      <div class="day-badge"><span>📦</span> Day 4 — Anuj's Builder Bootcamp</div>
    </header>
    <div class="divider"><span class="divider-icon">✦</span></div>
    <div class="input-section">
      <label class="input-label" for="dayInput">// how was your day?</label>
      <textarea id="dayInput" class="day-textarea" placeholder="Pour it all out... the embarrassing moments, the failed plans, the awkward silences, the nap you 100% didn't deserve. The AI will NOT be gentle." maxlength="800"></textarea>
      <div class="char-row">
        <span class="char-count" id="charCount">0 / 800</span>
        <span class="char-hint">min 10 chars to roast</span>
      </div>
      <button class="roast-btn" id="roastBtn" onclick="getRoasted()" disabled>
        <div class="btn-content"><span>🔥</span><span>ROAST ME</span></div>
      </button>
    </div>
    <div id="errorEl" style="display:none"></div>
    <div id="resultEl" style="display:none"></div>
    <footer>
      <div>Built by <a href="https://anuj-builds.vercel.app" target="_blank">Anuj</a> · Bootcamp by Love Bhiya 🙏</div>
      <div style="margin-top:6px;opacity:0.5">anuj-builds.vercel.app</div>
    </footer>
  </div>
  <script>
    const textarea = document.getElementById('dayInput');
    const charCount = document.getElementById('charCount');
    const roastBtn = document.getElementById('roastBtn');
    const resultEl = document.getElementById('resultEl');
    const errorEl = document.getElementById('errorEl');

    textarea.addEventListener('input', () => {
      const len = textarea.value.length;
      charCount.textContent = len + ' / 800';
      charCount.className = 'char-count' + (len >= 10 ? (len >= 50 ? ' ready' : ' active') : '');
      roastBtn.disabled = len < 10;
    });

    async function getRoasted() {
      const day = textarea.value.trim();
      if (day.length < 10) return;
      resultEl.style.display = 'none';
      errorEl.style.display = 'none';
      roastBtn.disabled = true;
      roastBtn.querySelector('.btn-content').innerHTML = '<div class="spinner"></div><span>COOKING YOUR ROAST...</span>';
      try {
        const res = await fetch('/api/roast', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ day }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong');
        const sentences = data.roast.trim().split(/(?<=[.!?])\s+/);
        const lastSentence = sentences.pop();
        const mainRoast = sentences.join(' ');
        resultEl.style.display = 'block';
        resultEl.innerHTML = '<div class="result-section"><div class="result-card"><div class="result-label">🔥 Your Roast <div class="result-label-line"></div></div><p class="roast-text">' + escapeHtml(mainRoast) + (lastSentence ? '<span class="wholesome">' + escapeHtml(lastSentence) + '</span>' : '') + '</p><div class="share-row"><button class="share-btn" id="copyBtn">📋 Copy Roast</button><button class="retry-btn" onclick="resetApp()">🔄 Roast Again</button></div></div></div>';
        document.getElementById('copyBtn').addEventListener('click', () => copyRoast(data.roast));
        resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } catch (err) {
        errorEl.style.display = 'block';
        errorEl.innerHTML = '<div class="error-card"><span>⚠️</span><span>' + escapeHtml(err.message) + '</span></div>';
      } finally {
        roastBtn.disabled = false;
        roastBtn.querySelector('.btn-content').innerHTML = '<span>🔥</span><span>ROAST ME</span>';
      }
    }

    function resetApp() {
      textarea.value = '';
      charCount.textContent = '0 / 800';
      charCount.className = 'char-count';
      roastBtn.disabled = true;
      resultEl.style.display = 'none';
      errorEl.style.display = 'none';
      textarea.focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function copyRoast(text) {
      try {
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✅ Copied!';
        setTimeout(() => btn.textContent = '📋 Copy Roast', 2000);
      } catch { alert(text); }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Roast My Day</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #060810; color: #fff; min-height: 100vh; }
    .hero { background: radial-gradient(ellipse at 50% 0%, #3a0a0a 0%, #1a0505 40%, #060810 100%); padding: 50px 20px 30px; text-align: center; }
    .hero-emoji { font-size: 4rem; margin-bottom: 12px; }
    .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 7vw, 3.5rem); background: linear-gradient(135deg, #fff, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .hero p { color: #ff6b6b88; letter-spacing: 3px; font-size: 0.8rem; }
    .section { max-width: 700px; margin: 0 auto; padding: 30px 16px; }
    .section-title { font-size: 0.68rem; letter-spacing: 4px; color: #ff6b6b; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, #ff6b6b33, transparent); }
    textarea { width: 100%; background: #0d0a0a; border: 1px solid #2a1515; border-radius: 16px; padding: 18px; color: #fff; font-family: 'Inter', sans-serif; font-size: 0.95rem; resize: none; height: 160px; outline: none; transition: border-color 0.2s; line-height: 1.6; }
    textarea:focus { border-color: #ff6b6b55; }
    textarea::placeholder { color: #4a3535; }
    .mood-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
    @media(min-width: 500px) { .mood-grid { grid-template-columns: repeat(6, 1fr); } }
    .mood-btn { background: #0d0a0a; border: 1px solid #2a1515; border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .mood-btn:hover, .mood-btn.selected { border-color: #ff6b6b; background: #1a0a0a; }
    .mood-emoji { font-size: 1.5rem; display: block; margin-bottom: 4px; }
    .mood-label { font-size: 0.65rem; color: #666; }
    .roast-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #8b0000, #cc2222); border: none; border-radius: 16px; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 16px; letter-spacing: 1px; }
    .roast-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px #cc222244; }
    .roast-btn:active { transform: translateY(0); }
    .result-card { background: linear-gradient(135deg, #0d0a0a, #060810); border: 1px solid #2a1515; border-radius: 16px; padding: 24px; margin-top: 20px; display: none; animation: fadeIn 0.4s ease; }
    .result-card.visible { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .roast-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .roast-icon { font-size: 1.8rem; }
    .roast-title { font-size: 0.7rem; letter-spacing: 3px; color: #ff6b6b; text-transform: uppercase; }
    .roast-text { font-size: 1rem; line-height: 1.8; color: #ddd; }
    .rating-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid #2a1515; }
    .rating-label { font-size: 0.68rem; letter-spacing: 2px; color: #666; margin-bottom: 10px; }
    .rating-bars { display: flex; flex-direction: column; gap: 8px; }
    .rating-bar { display: flex; align-items: center; gap: 10px; }
    .rating-name { font-size: 0.75rem; color: #888; min-width: 80px; }
    .bar-bg { flex: 1; height: 6px; background: #1a0a0a; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #8b0000, #ff6b6b); transition: width 1s ease; }
    .share-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid #2a1515; border-radius: 12px; color: #888; font-size: 0.85rem; cursor: pointer; margin-top: 16px; transition: all 0.2s; }
    .share-btn:hover { border-color: #ff6b6b55; color: #ff6b6b; }
    .history-item { background: #0d0a0a; border: 1px solid #1a0a0a; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; }
    .history-date { font-size: 0.65rem; color: #555; margin-bottom: 4px; }
    .history-preview { font-size: 0.82rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    footer { text-align: center; padding: 30px 20px; color: #2a1515; font-size: 0.72rem; letter-spacing: 2px; }
    footer span { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-emoji">🔥</div>
    <h1>Roast My Day</h1>
    <p>TELL ME YOUR DAY · GET ROASTED</p>
  </div>

  <div class="section">
    <div class="section-title">How was your day?</div>
    <textarea id="dayInput" placeholder="Tell me about your day... What did you do? What went wrong? What did you eat? Don't hold back!"></textarea>

    <div class="section-title" style="margin-top:20px">Your mood</div>
    <div class="mood-grid">
      <div class="mood-btn selected" data-mood="terrible" onclick="selectMood(this)"><span class="mood-emoji">😭</span><span class="mood-label">Terrible</span></div>
      <div class="mood-btn" data-mood="bad" onclick="selectMood(this)"><span class="mood-emoji">😤</span><span class="mood-label">Bad</span></div>
      <div class="mood-btn" data-mood="meh" onclick="selectMood(this)"><span class="mood-emoji">😑</span><span class="mood-label">Meh</span></div>
      <div class="mood-btn" data-mood="okay" onclick="selectMood(this)"><span class="mood-emoji">🙂</span><span class="mood-label">Okay</span></div>
      <div class="mood-btn" data-mood="good" onclick="selectMood(this)"><span class="mood-emoji">😊</span><span class="mood-label">Good</span></div>
      <div class="mood-btn" data-mood="amazing" onclick="selectMood(this)"><span class="mood-emoji">🤩</span><span class="mood-label">Amazing</span></div>
    </div>

    <button class="roast-btn" onclick="getRoast()">🔥 ROAST MY DAY</button>

    <div class="result-card" id="resultCard">
      <div class="roast-header">
        <span class="roast-icon">🎤</span>
        <span class="roast-title">Your Roast</span>
      </div>
      <div class="roast-text" id="roastText"></div>
      <div class="rating-section">
        <div class="rating-label">DAY RATINGS</div>
        <div class="rating-bars">
          <div class="rating-bar"><span class="rating-name">Productivity</span><div class="bar-bg"><div class="bar-fill" id="bar1" style="width:0%"></div></div></div>
          <div class="rating-bar"><span class="rating-name">Social Life</span><div class="bar-bg"><div class="bar-fill" id="bar2" style="width:0%"></div></div></div>
          <div class="rating-bar"><span class="rating-name">Health</span><div class="bar-bg"><div class="bar-fill" id="bar3" style="width:0%"></div></div></div>
          <div class="rating-bar"><span class="rating-name">Overall</span><div class="bar-bg"><div class="bar-fill" id="bar4" style="width:0%"></div></div></div>
        </div>
      </div>
      <button class="share-btn" onclick="copyRoast()">📋 Copy Roast</button>
    </div>

    <div class="section-title" style="margin-top:30px">Roast History</div>
    <div id="historyList"><div style="color:#333;font-size:0.82rem;text-align:center;padding:20px">No roasts yet!</div></div>
  </div>

  <footer>Built by <span>Anuj</span> · Roast My Day 🔥</footer>

  <script>
    let selectedMood = 'terrible';
    let roastHistory = JSON.parse(localStorage.getItem('roastHistory') || '[]');

    const roastTemplates = {
      terrible: [
        "Bhai, even your shadow tried to leave you today. A terrible day? More like a terrible life choice compilation. But hey, at least you survived — that's more than most of your plans do. Tomorrow is a new disaster waiting to happen!",
        "Your day was so bad, even Google Maps couldn't find a way out of it. You woke up, chose chaos, and delivered. Respect for the commitment though. Kal subah chai pi ke start karo — maybe the universe will show mercy.",
        "Yaar, your day had more plot twists than a bad Bollywood movie. The villain? You. The hero? Also you, but losing badly. But every bad day is just a good story later. Keep going!"
      ],
      bad: [
        "Beta, your day was like Maggi without masala — technically food, but why bother? You could've done better but you chose the comfortable path of mediocrity. Kal thoda effort dalo, please.",
        "Your day was bad but not even interestingly bad. Just boring bad. Like a bandh on a holiday. You have all the ingredients for a good day but you keep making dal without salt. Try harder!",
        "Bhai, even your chai must have gone cold today. A bad day is fine — but don't make it a habit. You're better than this. Probably. We'll see."
      ],
      meh: [
        "Meh? MEH?! You wasted 24 precious hours of this universe for MEH?! Even a cow standing in traffic has more eventful days than you. Rise up, legend. You're capable of at least a 6/10.",
        "Your day was so average it almost broke the mediocrity scale. You existed today. Congratulations. Tomorrow, try actually living. Even a little.",
        "Bhai, meh is the participation trophy of days. You showed up but forgot to play. Tomorrow — do ONE thing differently. Just one. I believe in you. Barely, but I do."
      ],
      okay: [
        "Okay? OKAY?! With all your potential you gave the world an OKAY day?! You're like a biryani that forgot the spices. The base is there but where's the magic? Push harder tomorrow!",
        "An okay day from you is like getting 60% when you could've scored 95. You have unlimited potential and you're out here being average. Disappointing but fixable. Fix it.",
        "You had an okay day which means you left 40% on the table. That 40% could've been legendary. Tomorrow, claim it. India is waiting for its builder!"
      ],
      good: [
        "Good day huh? Look at you, actually functioning like a human being! But don't get comfortable — good is the enemy of great. You're one good habit away from being unstoppable. Don't stop here!",
        "A good day! Finally! Your ancestors are relieved. Now don't ruin it by staying up till 3am scrolling. Sleep, wake up, make it great tomorrow. You're on a roll!",
        "Good day detected! Alert: this person might actually be figuring life out. Don't jinx it. Sleep on time, eat properly, and repeat. Consistency is your only enemy now."
      ],
      amazing: [
        "AMAZING?! Who are you and what did you do with the person who usually wastes their day?! Okay okay, props given. But now the bar is set. No going back to meh after this. Maintain it!",
        "An amazing day! The universe is shocked. Your future self is doing a happy dance. Just remember — tomorrow the world expects the same energy. No pressure. All pressure.",
        "Bhai, amazing day! Screenshot this feeling. Save it. Use it as fuel on your terrible days. You proved you can do it. Now do it again. And again. Champion mindset unlocked!"
      ]
    };

    const keywords = {
      youtube: "You spent time on YouTube instead of building? Bold strategy. Zero results, but bold.",
      sleep: "You slept through opportunities like a pro. Gold medal in napping.",
      chai: "At least the chai was good. Some days that's all we have.",
      maggi: "Maggi for a meal? Living the bachelor life at full intensity.",
      study: "You actually studied? Proud. Keep that energy.",
      gym: "Gym day! Your future self is grateful even if your present self is dying.",
      phone: "Hours on the phone but zero calls made to your goals.",
      late: "Running late is your cardio apparently.",
      exam: "Exam pressure is real. You're handling it. Barely, but still.",
      neet: "NEET prep is a marathon. You're still running. That's what matters."
    };

    function selectMood(el) {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      selectedMood = el.dataset.mood;
    }

    function getRoast() {
      const day = document.getElementById('dayInput').value.trim();
      if (!day) { alert('Tell me about your day first!'); return; }

      const resultCard = document.getElementById('resultCard');
      resultCard.classList.add('visible');

      const templates = roastTemplates[selectedMood];
      let roast = templates[Math.floor(Math.random() * templates.length)];

      const lowerDay = day.toLowerCase();
      for (const [word, extra] of Object.entries(keywords)) {
        if (lowerDay.includes(word)) {
          roast += ' ' + extra;
          break;
        }
      }

      document.getElementById('roastText').textContent = roast;

      const ratings = generateRatings(lowerDay, selectedMood);
      setTimeout(() => {
        document.getElementById('bar1').style.width = ratings.productivity + '%';
        document.getElementById('bar2').style.width = ratings.social + '%';
        document.getElementById('bar3').style.width = ratings.health + '%';
        document.getElementById('bar4').style.width = ratings.overall + '%';
      }, 100);

      const historyItem = {
        date: new Date().toLocaleDateString('en-IN'),
        day: day.substring(0, 60),
        roast: roast,
        mood: selectedMood
      };
      roastHistory.unshift(historyItem);
      if (roastHistory.length > 5) roastHistory.pop();
      localStorage.setItem('roastHistory', JSON.stringify(roastHistory));
      renderHistory();
    }

    function generateRatings(day, mood) {
      const moodScores = { terrible: 15, bad: 30, meh: 45, okay: 55, good: 72, amazing: 90 };
      const base = moodScores[mood] || 50;
      const bonus = (day.includes('study') || day.includes('gym') || day.includes('work')) ? 15 : 0;
      const penalty = (day.includes('youtube') || day.includes('sleep') || day.includes('late')) ? -10 : 0;
      return {
        productivity: Math.min(95, Math.max(5, base + bonus + penalty + Math.floor(Math.random() * 10))),
        social: Math.min(95, Math.max(5, base + Math.floor(Math.random() * 20) - 5)),
        health: Math.min(95, Math.max(5, base + (day.includes('gym') ? 20 : 0) + Math.floor(Math.random() * 15))),
        overall: Math.min(95, Math.max(5, base + Math.floor(Math.random() * 10)))
      };
    }

    function copyRoast() {
      const text = document.getElementById('roastText').textContent;
      navigator.clipboard.writeText(text);
      const btn = document.querySelector('.share-btn');
      btn.textContent = '✅ Copied!';
      setTimeout(() => btn.textContent = '📋 Copy Roast', 2000);
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (roastHistory.length === 0) {
        list.innerHTML = '<div style="color:#333;font-size:0.82rem;text-align:center;padding:20px">No roasts yet!</div>';
        return;
      }
      list.innerHTML = roastHistory.map(h => `
        <div class="history-item">
          <div class="history-date">${h.date} · ${h.mood}</div>
          <div class="history-preview">${h.day}...</div>
        </div>
      `).join('');
    }

    renderHistory();
  </script>
</body>
</html>
